<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Bookmark-Tab Title</title>
  <!-- Full-bleed variant for toolbar and extension pages (16, 32, 48 px). Drawn on a 32 grid with even coordinates so it stays crisp at 16 px. -->
  <rect width="32" height="32" rx="7" fill="#083F47"/>
  <!-- Stem of the T: a bookmark ribbon with a 45° notch -->
  <path d="M12 11 H20 V26 L16 22 L12 26 Z" fill="#FB8742"/>
  <!-- Crossbar of the T: the tab title -->
  <rect x="6" y="6" width="20" height="6" rx="2" fill="#5EEAD4"/>
</svg>
