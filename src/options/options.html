<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookmark-Tab Title</title>
    <link rel="icon" href="../../icons/icon-32.png" />
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="../ui/components.css" />
    <link rel="stylesheet" href="options.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <div class="page">
      <header class="stack">
        <div class="brand">
          <img class="brand__icon" src="../../icons/icon-toolbar.svg" alt="" />
          <p class="text-title" data-i18n="extName"></p>
        </div>
        <h1 class="text-display" data-i18n="optionsHeading"></h1>
        <p class="text-body tone-secondary" data-i18n="optionsIntro"></p>
      </header>

      <section class="surface">
        <label class="row" for="append-page-title">
          <span class="row__main">
            <span class="text-body text-strong" data-i18n="appendTitleLabel"></span>
            <span class="text-caption tone-secondary" data-i18n="appendTitleHint"></span>
          </span>
          <input id="append-page-title" class="switch" type="checkbox" role="switch" />
        </label>
      </section>

      <section class="stack">
        <div class="toolbar">
          <label class="search">
            <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input id="search" class="field" type="search" autocomplete="off" data-i18n-attr="placeholder:optionsSearch,aria-label:optionsSearch" />
          </label>
          <div class="controls">
            <div class="segmented" role="radiogroup" data-i18n-attr="aria-label:viewLabel">
              <label><input id="view-folders" type="radio" name="view" value="folders" /><span data-i18n="view_folders"></span></label>
              <label><input id="view-list" type="radio" name="view" value="list" /><span data-i18n="view_list"></span></label>
            </div>
            <span class="select"><select id="filter" data-i18n-attr="aria-label:filterLabel"></select></span>
            <span class="select"><select id="sort" data-i18n-attr="aria-label:sortLabel"></select></span>
          </div>
          <p id="count" class="text-caption tone-secondary" aria-live="polite"></p>
        </div>

        <div id="tree" class="surface tree" hidden></div>
        <ul id="list" class="surface list" aria-labelledby="list-label" hidden></ul>
        <p id="list-label" class="visually-hidden" data-i18n="scopeLabel"></p>

        <div id="empty" class="surface empty" hidden>
          <p id="empty-title" class="text-title"></p>
          <p id="empty-body" class="text-body tone-secondary"></p>
        </div>
      </section>

      <details id="how" class="surface how folder">
        <summary class="row folder__head">
          <span class="folder__chevron" aria-hidden="true"></span>
          <h2 class="text-title folder__name" data-i18n="optionsHowTitle"></h2>
        </summary>
        <div class="row row--stack">
          <p class="text-body tone-secondary" data-i18n="howIntro"></p>
        </div>
        <div class="row row--stack">
          <p class="how__name"><span class="text-body text-strong" data-i18n="scope_exact"></span><span class="pill" data-i18n="howDefault"></span></p>
          <p class="text-body tone-secondary" data-i18n="howExact"></p>
        </div>
        <div class="row row--stack">
          <p class="text-body text-strong how__name" data-i18n="scope_below"></p>
          <p class="text-body tone-secondary" data-i18n="howBelow"></p>
        </div>
        <div class="row row--stack">
          <p class="text-body text-strong how__name" data-i18n="scope_contains"></p>
          <p class="text-body tone-secondary" data-i18n="howContains"></p>
        </div>
        <div class="row row--stack">
          <p class="text-body text-strong how__name" data-i18n="scope_host"></p>
          <p class="text-body tone-secondary" data-i18n="howHost"></p>
        </div>
        <div class="row row--stack">
          <p class="text-body text-strong" data-i18n="howWinsTitle"></p>
          <p class="text-body tone-secondary" data-i18n="howWins"></p>
        </div>
        <div class="row row--stack">
          <p class="text-caption tone-secondary" data-i18n="howTrail"></p>
        </div>
      </details>

      <footer class="footer text-caption tone-secondary">
        <a class="tone-accent" href="https://bearvil.github.io/privacy-policies/bookmark-tab-title-pp" target="_blank" rel="noopener" data-i18n="privacyPolicy"></a>
        <a class="tone-accent" href="https://github.com/bearvil/bookmark-tab-title" target="_blank" rel="noopener" data-i18n="sourceCode"></a>
        <span id="version"></span>
      </footer>
    </div>

    <template id="folder">
      <details class="folder">
        <summary class="row folder__head">
          <span class="folder__chevron" aria-hidden="true"></span>
          <span class="text-body text-strong truncate folder__name" data-field="name"></span>
          <span class="pill" data-field="wider" hidden></span>
          <span class="text-caption tone-secondary" data-field="count"></span>
        </summary>
        <ul class="list folder__list"></ul>
      </details>
    </template>

    <template id="row">
      <li class="row row--wrap">
        <label class="row__main">
          <span class="text-body text-strong truncate" data-field="title"></span>
          <span class="text-caption tone-secondary truncate" data-field="where"></span>
        </label>
        <label class="inline-switch text-caption tone-secondary" data-i18n-attr="title:pageTitleHint">
          <span data-i18n="pageTitleShort"></span>
          <input class="switch switch--small" type="checkbox" role="switch" data-field="page-title" />
        </label>
        <span class="select">
          <select data-field="scope">
            <option value="exact" data-i18n="scope_exact"></option>
            <option value="below" data-i18n="scope_below"></option>
            <option value="contains" data-i18n="scope_contains"></option>
            <option value="host" data-i18n="scope_host"></option>
          </select>
        </span>
        <input class="field field--compact row__full" type="text" autocomplete="off" spellcheck="false" data-field="text" hidden />
      </li>
    </template>
  </body>
</html>
