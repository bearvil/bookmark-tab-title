<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookmark-Tab Title</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="../ui/components.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="brand">
      <img class="brand__icon" src="../../icons/icon-toolbar.svg" alt="" />
      <p class="brand__name text-title truncate" data-i18n="extName"></p>
      <button id="open-options" class="icon-button" type="button" data-i18n-attr="aria-label:popupAllBookmarks,title:popupAllBookmarks">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
          <circle cx="16" cy="7" r="2" />
          <circle cx="10" cy="17" r="2" />
        </svg>
      </button>
    </header>

    <!-- The bookmark that names the page in this tab -->
    <main id="state-bookmark" class="stack" hidden>
      <section class="surface">
        <div class="row row--stack">
          <label class="field-label" for="name">
            <span class="text-caption tone-secondary" data-i18n="fieldName"></span>
            <span id="saved" class="text-micro toast" data-visible="false" data-i18n="saved"></span>
          </label>
          <input id="name" class="field" type="text" autocomplete="off" spellcheck="false" />
          <p id="shown-because" class="text-caption tone-secondary" hidden></p>
        </div>
      </section>
      <div class="group">
        <p id="scope-label" class="text-caption tone-secondary group__label" data-i18n="scopeLabel"></p>
        <div id="scope" class="surface choices" role="radiogroup" aria-labelledby="scope-label">
          <label class="row choice">
            <input class="radio" type="radio" name="scope" value="exact" />
            <span class="row__main">
              <span class="text-body text-strong" data-i18n="scope_exact"></span>
              <span class="text-caption tone-secondary truncate" data-detail="exact"></span>
            </span>
          </label>
          <label class="row choice">
            <input class="radio" type="radio" name="scope" value="below" />
            <span class="row__main">
              <span class="text-body text-strong" data-i18n="scope_below"></span>
              <span class="text-caption tone-secondary split" data-detail="below">
                <span data-i18n="belowDetail"></span>
                <span class="truncate" data-field="address"></span>
              </span>
            </span>
          </label>
          <label class="row choice">
            <input class="radio" type="radio" name="scope" value="contains" />
            <span class="row__main">
              <span class="text-body text-strong" data-i18n="scope_contains"></span>
              <span class="text-caption tone-secondary truncate" data-detail="contains"></span>
            </span>
          </label>
          <div id="contains-row" class="row row--stack" hidden>
            <input id="contains-text" class="field field--compact" type="text" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:containsPlaceholder,aria-label:scope_contains" />
            <p id="contains-hint" class="text-caption tone-secondary"></p>
          </div>
          <label class="row choice">
            <input class="radio" type="radio" name="scope" value="host" />
            <span class="row__main">
              <span class="text-body text-strong" data-i18n="scope_host"></span>
              <span class="text-caption tone-secondary truncate" data-detail="host"></span>
            </span>
          </label>
        </div>
      </div>
    </main>

    <!-- Web page that is not a bookmark -->
    <main id="state-none" class="stack" hidden>
      <section class="surface empty">
        <p class="text-title" data-i18n="popupNoBookmarkTitle"></p>
        <p class="text-body tone-secondary" data-i18n="popupNoBookmarkBody"></p>
      </section>
      <button id="add-bookmark" class="button button--primary button--block" type="button" data-i18n="popupAddBookmark"></button>
    </main>

    <!-- Browser pages where extensions cannot run -->
    <main id="state-unsupported" class="stack" hidden>
      <section class="surface empty">
        <p class="text-title" data-i18n="popupUnsupportedTitle"></p>
        <p class="text-body tone-secondary" data-i18n="popupUnsupportedBody"></p>
      </section>
    </main>
  </body>
</html>
